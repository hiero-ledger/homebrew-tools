name: Bug Report
description: Report a problem with a formula or workflow
labels: ["bug"]
body:
  - type: dropdown
    id: formula
    attributes:
      label: Formula
      options:
        - solo
        - hiero-cli
        - Other / unknown
    validations:
      required: true
  - type: input
    id: homebrew-version
    attributes:
      label: Homebrew version
      description: Output of `brew --version`
      placeholder: "Homebrew 4.x.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 (Sonoma) / Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `brew install hiero-ledger/tools/solo`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (include full error output)
    validations:
      required: true
